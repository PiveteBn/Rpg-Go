<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPG Go</title>
<style>
:root{--bg:#120d1f;--s1:#1c1530;--s2:#271d44;--bd:#3a2c63;--ac:#8b5cf6;--ac2:#c4b5fd;--on:#fff;--tx:#ece8f8;--mu:#a79cc8;--dg:#fb7185;--fn:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--hf:var(--fn);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-skin=viajante]{--bg:#17120c;--s1:#241b11;--s2:#33261a;--bd:#5a4326;--ac:#d9a441;--ac2:#f0cf8a;--on:#1a1208;--tx:#f3e9d2;--mu:#b9a47e;--hf:Georgia,"Times New Roman",serif}
[data-skin=cyberpunk]{--bg:#070712;--s1:#0f0f24;--s2:#17173a;--bd:#2b2b66;--ac:#ff2bd6;--ac2:#4df3ff;--on:#12001a;--tx:#e8f6ff;--mu:#8f95cf}
[data-skin=gotico]{--bg:#0b0809;--s1:#17100f;--s2:#241817;--bd:#4a2326;--ac:#b3202e;--ac2:#f0a3a9;--tx:#eadede;--mu:#a99090;--hf:Georgia,"Times New Roman",serif}
[data-skin=minimal]{--bg:#f5f5f7;--s1:#fff;--s2:#ececf1;--bd:#d6d6df;--ac:#4f46e5;--ac2:#4338ca;--tx:#1b1b22;--mu:#666675;--dg:#dc2626;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fn)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--s1);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--s1);border-bottom:1px solid var(--bd)}
.brand{font:700 18px var(--hf);margin-right:6px}
main{max-width:1100px;margin:0 auto;padding:16px 14px 96px}
h1,h2,h3{font-family:var(--hf);margin:.3em 0}h2{font-size:19px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:38px}
button:hover,button.on{border-color:var(--ac)}
.pri,.tabs .on,header .on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.dg{color:var(--dg)}.ic{padding:4px 9px;min-height:34px}
input,select,textarea{width:100%;min-height:38px;padding:8px 10px;font-size:16px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:20px;min-height:20px}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 3px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:14px}
.in{background:var(--s2);border-radius:14px;padding:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nw{flex-wrap:nowrap}.nw>div{flex:1;min-width:0}
.mu{color:var(--mu)}.logo{width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-right:8px}[data-skin=minimal] .logo{filter:invert(1)}.about{display:flex;gap:18px;align-items:flex-start;margin-top:14px}.about .logo{width:84px;height:84px;margin:0;flex:none}.about p{margin:.4em 0}#wm{text-align:center;color:var(--mu);font-size:13px;padding:0 14px 90px}#wm b{color:var(--tx)}
.ava{width:56px;height:56px;border-radius:16px;background:var(--s2);display:grid;place-items:center;overflow:hidden;font:700 22px var(--hf)}.nw>.ava{flex:none}.ava img{width:100%;height:100%;object-fit:cover}.big{width:96px;height:96px;border-radius:22px}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:18px 0 26px}.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.05}.hero p{max-width:52ch}
.d20{width:150px;height:150px;border:0;padding:0;font:700 46px var(--hf);color:var(--on);background:linear-gradient(145deg,var(--ac),var(--ac2));clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);transition:transform .6s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px}.tabs button{white-space:nowrap;border-radius:99px}
.sec{display:none}.sec.on{display:block}
span.mod{flex:none;min-width:56px;text-align:center;font:700 26px var(--hf);color:var(--ac2)}
.bar{height:10px;border-radius:9px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;padding:0;border-radius:50%;font-size:24px;background:var(--ac);border-color:var(--ac)}
#dice{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:80%;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--s1);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s}
#dice.open{transform:none}
.res{font:700 46px var(--hf);color:var(--ac2);margin:10px 0;animation:pop .35s}.res small{display:block;font:13px var(--fn);color:var(--mu)}
@keyframes pop{from{transform:scale(.85);opacity:.3}}
.bd{margin-left:6px;padding:0 7px;border-radius:99px;background:var(--ac);color:var(--on);font-size:12px}
.h{padding:6px 0;border-bottom:1px solid var(--bd)}
.ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:#000a}.ov .card{max-width:420px;width:100%}
#toast{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;padding:6px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--bd);opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}#toast.er{color:var(--dg)}
@media(min-width:900px){.sec{display:block;break-inside:avoid;margin-bottom:14px}.tabs{display:none}.sheet{columns:2;column-gap:14px}#dice{left:auto;right:16px;bottom:16px;width:380px;border-radius:20px;border:1px solid var(--bd)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{:root{--bg:#fff;--s1:#fff;--s2:#f1f1f1;--bd:#999;--tx:#000;--mu:#444;--ac2:#000}header,.tabs,#fab,#dice,button,.noprint,body::before{display:none!important}.sec{display:block!important;break-inside:avoid;margin-bottom:10px}.sheet{columns:1}input,textarea{border:0!important;background:none!important}main{padding:0}}
</style>
</head>
<body>
<header><b class="brand"><img id="lg" class="logo" alt="">RPG Go</b><nav class="row"><button data-go="home">Início</button><button data-go="chars">Personagens</button><button data-go="tpl">Modelos</button></nav><select id="th" aria-label="Tema" style="width:auto;margin-left:auto"><option value="classico">Clássico</option><option value="viajante">Viajante</option><option value="cyberpunk">Cyberpunk</option><option value="gotico">Terror gótico</option><option value="minimal">Minimalista</option></select></header>
<main id="app"></main>
<footer id="wm">Criado por <b>Breno Gabriel</b>, @orgulhosoben no Discord e no Instagram</footer>
<button id="fab" data-a="dice" aria-label="Abrir dados">🎲</button>
<aside id="dice" inert></aside><div id="md"></div><div id="toast" role="status"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<datalist id="sl"><option>D&amp;D 5e</option><option>Ordem Paranormal</option><option>Tormenta20</option><option>Call of Cthulhu</option><option>Cyberpunk RED</option></datalist>
<datalist id="pl"><option>Sem</option><option>Treinado</option><option>Especialista</option><option>Mestre</option></datalist>

const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const okId=k=>/^[a-z][a-z0-9]*$/.test(k)&&(()=>{try{Function('var '+k);return 1}catch(e){return 0}})();
function calc(f,sc){try{f=String(f);if(!/^[\w\s+\-*/().,%]*$/.test(f))return 0;const m={...sc,floor:Math.floor,ceil:Math.ceil,round:Math.round,min:Math.min,max:Math.max,abs:Math.abs},ks=Object.keys(m);
 if((f.match(/[a-z_]\w*/gi)||[]).some(i=>!ks.includes(i)))return 0;const r=Function(...ks,'return ('+f+')')(...ks.map(k=>m[k]));return Number.isFinite(r)?Math.round(r*100)/100:0}catch(e){return 0}}
const scope=(c,v)=>{const o={nivel:+c.lvl||0};c.attrs.forEach(a=>{const k=norm(a.n);if(okId(k))o[k]=+a.v||0});o.v=v;return o};
const modOf=(c,a)=>a.f?calc(a.f,scope(c,+a.v||0)):0,mt=(c,a)=>a.f?fmt(modOf(c,a)):'–';
function roll(f,sc={}){const p=[];let x=0;
 const e=String(f).replace(/(\d*)d(\d+)|[a-z_]\w*/gi,(m,n,s)=>{if(s){n=Math.min(+n||1,100);s=Math.min(+s,1000)||1;const r=Array.from({length:n},()=>1+Math.floor(Math.random()*s));p.push(n+'d'+s+'['+r.join(',')+']');return r.reduce((a,b)=>a+b,0)}
 m=m.toLowerCase();if(FN.includes(m))return m;if(Object.hasOwn(sc,m))return'('+(+sc[m]||0)+')';x=1;return 0});
 return x||!e.trim()?null:{t:calc(e,{}),d:p.join(' ')}}
function doRoll(l,f,sc){const r=roll(f,sc);if(!r)return flash('Fórmula inválida: '+f,1);last={l,f,t:r.t,d:r.d};S.rolls.unshift(last);S.rolls=S.rolls.slice(0,60);save();renderDice();openDice(true)}

function sheet(){const c=cur();if(!c)return chars();

 switch(a){
